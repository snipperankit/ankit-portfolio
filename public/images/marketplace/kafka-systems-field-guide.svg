<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Apache Kafka">
  <defs>
    <radialGradient id="kfk-bg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#132234" />
      <stop offset="100%" stop-color="#060b12" />
    </radialGradient>
    <linearGradient id="kfk-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ff0f0" />
      <stop offset="100%" stop-color="#2fb8c6" />
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#kfk-bg)" />
  <!-- circuit-board tracery -->
  <g stroke="#1d3a4a" stroke-width="1" opacity=".55">
    <path d="M0 26 H70 L86 42 H160" fill="none" />
    <path d="M400 60 H330 L316 76 H250" fill="none" />
    <path d="M0 190 H60 L74 176 H150" fill="none" />
    <path d="M400 150 H340 L326 166 H260" fill="none" />
    <circle cx="70" cy="26" r="2.4" fill="#1d3a4a" />
    <circle cx="330" cy="60" r="2.4" fill="#1d3a4a" />
    <circle cx="60" cy="190" r="2.4" fill="#1d3a4a" />
    <circle cx="340" cy="150" r="2.4" fill="#1d3a4a" />
  </g>

  <!-- kafka node mark -->
  <g transform="translate(26,26)">
    <circle cx="0" cy="0" r="5.5" fill="url(#kfk-teal)" />
    <circle cx="0" cy="20" r="5.5" fill="url(#kfk-teal)" />
    <circle cx="18" cy="10" r="5.5" fill="url(#kfk-teal)" />
    <line x1="0" y1="0" x2="18" y2="10" stroke="#8ff0f0" stroke-width="1.4" opacity=".8" />
    <line x1="0" y1="20" x2="18" y2="10" stroke="#8ff0f0" stroke-width="1.4" opacity=".8" />
    <line x1="0" y1="0" x2="0" y2="20" stroke="#8ff0f0" stroke-width="1.4" opacity=".8" />
  </g>
  <text x="60" y="33" fill="url(#kfk-teal)" font-family="monospace" font-size="21" font-weight="700">Apache Kafka</text>

  <!-- hex grid with topic/stream icons -->
  <g fill="none" stroke="url(#kfk-teal)" stroke-width="1.4" opacity=".85">
    <polygon points="80,70 106,85 106,115 80,130 54,115 54,85" />
    <polygon points="200,60 226,75 226,105 200,120 174,105 174,75" />
    <polygon points="320,70 346,85 346,115 320,130 294,115 294,85" />
    <polygon points="140,120 166,135 166,165 140,180 114,165 114,135" />
    <polygon points="260,120 286,135 286,165 260,180 234,165 234,135" />
  </g>

  <!-- icon: cloud + ingest arrow -->
  <g transform="translate(80,100)" stroke="#bff5f5" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M-14,-6 a8,8 0 0 1 15,-3 a6,6 0 0 1 1,12 h-17 a6,6 0 0 1 1,-9z" />
    <line x1="0" y1="4" x2="0" y2="16" />
    <polyline points="-5,10 0,16 5,10" />
  </g>

  <!-- icon: hourglass -->
  <g transform="translate(200,90)" stroke="#bff5f5" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-9,-10 h18 l-9,10 z" />
    <path d="M-9,10 h18 l-9,-10 z" />
    <line x1="-11" y1="-10" x2="11" y2="-10" />
    <line x1="-11" y1="10" x2="11" y2="10" />
  </g>

  <!-- icon: search / observability -->
  <g transform="translate(320,100)" stroke="#bff5f5" stroke-width="1.6" fill="none" stroke-linecap="round">
    <circle cx="-3" cy="-3" r="7" />
    <line x1="2" y1="2" x2="10" y2="10" />
  </g>

  <!-- icon: bar chart / throughput -->
  <g transform="translate(140,150)" stroke="#bff5f5" stroke-width="1.6" fill="none" stroke-linecap="round">
    <line x1="-10" y1="10" x2="-10" y2="-2" />
    <line x1="0" y1="10" x2="0" y2="-9" />
    <line x1="10" y1="10" x2="10" y2="-5" />
  </g>

  <!-- icon: consumer / person node -->
  <g transform="translate(260,150)" stroke="#bff5f5" stroke-width="1.6" fill="none" stroke-linecap="round">
    <circle cx="0" cy="-6" r="4.4" />
    <path d="M-8,10 a8,8 0 0 1 16,0" />
  </g>

  <text x="200" y="208" fill="#4c7d86" font-family="monospace" font-size="10" text-anchor="middle" letter-spacing="1">
    topics · partitions · consumer groups
  </text>
</svg>
